[project]
name = "clinic_ops_copilot"
version = "0.1.0"
description = "Clinic Operations Copilot Multi-Agent System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.2.0",
    "duckdb>=1.3.0",
    "mcp[cli]>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
